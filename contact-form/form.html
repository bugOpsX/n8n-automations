<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect | Sumant Kumar</title>
  <style>
    :root {
      --bg-color: #050505;
      --card-bg: rgba(10, 10, 10, 0.75); /* Slightly darker for contrast */
      --accent-color: #0070f3; 
      --text-main: #ffffff;
      --text-dim: #888888;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden; /* Prevents scrollbars from particles */
      position: relative;
    }

    /* Particle Canvas Styling */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none; /* Allows clicks to pass through to the form */
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 10;
    }

    /* Rest of your existing CSS styles... */
    header { text-align: left; margin-bottom: 32px; }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
    p.subtitle { font-size: 14px; color: var(--text-dim); line-height: 1.5; }
    .input-group { margin-bottom: 20px; }
    label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); margin-bottom: 8px; }
    input, textarea { width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 15px; transition: all 0.3s ease; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent-color); background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 0 4px rgba(0, 112, 243, 0.15); }
    textarea { resize: vertical; min-height: 110px; }
    button { width: 100%; background: var(--text-main); color: var(--bg-color); border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); margin-top: 10px; }
    button:hover { background: var(--accent-color); color: white; transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0, 112, 243, 0.4); }
    footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 13px; color: var(--text-dim); }
    footer a { color: var(--text-main); text-decoration: none; font-weight: 600; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="container">
    <header>
      <h1>Initialize Contact</h1>
      <p class="subtitle">Enter your details below to trigger my communication workflow.</p>
    </header>

    <form method="POST" action="https://pamila-intercalary-crabbily.ngrok-free.dev/webhook/form-logger">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="John Doe" required />
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="john@example.com" required />
      </div>

      <div class="input-group">
        <label>Project Brief / Inquiry</label>
        <textarea name="message" placeholder="How can I help you automate your success?" required></textarea>
      </div>

      <button type="submit">Execute Workflow</button>
    </form>

    <footer>
      Engineered by <a href="https://github.com/bugopsX" target="_blank">Sumant</a>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const particleCount = 80;

    window.addEventListener('resize', resizeCanvas);
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();

    class Particle {
      constructor() {
        this.init();
      }
      init() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.radius = Math.random() * 1.5;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 112, 243, 0.5)';
        ctx.fill();
      }
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        p.update();
        p.draw();

        for (let j = i + 1; j < particles.length; j++) {
          let p2 = particles[j];
          let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (dist < 150) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(0, 112, 243, ${0.15 * (1 - dist / 150)})`;
            ctx.lineWidth = 0.5;
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
